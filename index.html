<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구간 보관함</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#15171d;
  --panel:#1c1f27;
  --panel-2:#252935;
  --line:#323746;
  --text:#ecebe7;
  --muted:#a3a6b1;
  --faint:#6f7380;
  --wave:#4c5263;
  --accent:#f5b83d;
  --accent-ink:#1d1606;
  --accent-soft:rgba(245,184,61,.16);
  --danger:#f07563;
  --radius-lg:14px;
  --radius:9px;
  --radius-sm:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{
  display:grid;grid-template-columns:minmax(320px,400px) 1fr;grid-template-areas:"side main";
  height:100vh;height:100dvh;
}
.side{grid-area:side;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.main{grid-area:main;overflow:auto;padding:28px 32px 48px}
.main-inner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- side ---------- */
.side-head{padding:20px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;flex:none}
.count{color:var(--muted);font-size:13px;font-weight:500}
.head-actions{display:flex;gap:6px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{
  width:100%;padding:10px 12px 10px 34px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--bg);outline:none;
}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--faint)}

.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:13.5px;font-weight:600}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg.full{display:flex}
.seg.full button{flex:1}

.list{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;min-height:0}
.clip{
  position:relative;display:grid;grid-template-columns:18px 112px 1fr auto;gap:10px;align-items:center;
  padding:8px 8px 8px 4px;border-radius:var(--radius);border:1px solid transparent;
}
.clip:hover{background:var(--panel-2)}
.clip.active{background:var(--accent-soft);border-color:rgba(245,184,61,.45)}
.clip.sortable-ghost{opacity:.35}
.clip.sortable-chosen{background:var(--panel-2)}
.drag{
  width:18px;height:40px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;
  border:0;background:none;padding:0;border-radius:4px;
}
.drag:active{cursor:grabbing}
.drag svg{width:12px;height:18px}
.no-sort .drag{visibility:hidden}
.play-hit{
  grid-column:2 / 4;display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center;
  border:0;background:none;padding:0;text-align:left;min-width:0;
}
.thumb{position:relative;width:112px;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.audio{background:var(--panel-2);color:var(--accent)}
.thumb.audio svg{position:absolute;inset:0;width:100%;height:100%}
.thumb .len{
  position:absolute;right:4px;bottom:4px;padding:1px 5px;border-radius:4px;
  background:rgba(0,0,0,.78);color:#fff;font-size:11.5px;font-weight:600;
}
.clip.active .thumb::after{
  content:"";position:absolute;inset:0;border:2px solid var(--accent);border-radius:var(--radius-sm);
}
.meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.meta .title{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta .range{font-size:12.5px;color:var(--accent);font-weight:600}
.meta .memo{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{display:inline-block;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.clip-actions{display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .12s}
.clip:hover .clip-actions,.clip:focus-within .clip-actions,.clip.active .clip-actions{opacity:1}
@media (hover:none){.clip-actions{opacity:1}}

.empty{padding:36px 22px;color:var(--muted);text-align:center;font-size:14px;line-height:1.6}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:var(--radius);border:1px solid var(--line);background:var(--panel-2);
  padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap;
}
.btn:hover{border-color:#454b5c}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:#ffd27a;background:#ffc451}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:var(--panel-2);border-color:transparent}
.btn-sm{padding:6px 10px;font-size:13px}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--muted);
}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}
.icon-btn.danger:hover{color:var(--danger)}
.icon-btn svg{width:16px;height:16px}
.btn:disabled,.icon-btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- players ---------- */
.notice{
  border:1px solid rgba(245,184,61,.4);background:var(--accent-soft);border-radius:var(--radius);
  padding:12px 14px;font-size:13.5px;line-height:1.6;
}
.notice b{color:var(--accent)}
.notice code{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:4px;font-size:12.5px}
.player-box{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius-lg);overflow:hidden}
.player-box iframe,.player-box #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--muted);text-align:center;padding:20px;background:#0d0e12;font-size:14.5px;
}
.placeholder svg{width:44px;height:44px;color:var(--faint)}
.player-error{
  position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:var(--radius);
  background:rgba(20,10,8,.92);border:1px solid rgba(240,117,99,.5);color:#ffd9d2;font-size:13.5px;
}

.audio-box{
  display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  padding:24px;border-radius:var(--radius-lg);background:var(--panel);border:1px solid var(--line);min-height:150px;
}
.big-play{
  width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none;
}
.big-play:hover{background:#ffc451}
.big-play svg{width:28px;height:28px}
.audio-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.audio-kind{font-size:12.5px;color:var(--accent);font-weight:700}
.audio-title{font-size:20px;font-weight:700;line-height:1.3;word-break:break-word}
.audio-sub{font-size:13.5px;color:var(--muted);word-break:break-all}

/* tape: an editor's strip with in/out marks; becomes a waveform for audio */
.deck{display:flex;flex-direction:column;gap:8px}
.now{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:24px}
.now-title{font-weight:650;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-time{color:var(--muted);font-size:13.5px;flex:none}
.now-time b{color:var(--text);font-weight:600}
.tape{
  position:relative;height:34px;border-radius:8px;background:
    repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.06) calc(10% - 1px) 10%),
    var(--panel);
  border:1px solid var(--line);cursor:pointer;touch-action:none;overflow:hidden;
}
.tape.wave{height:76px;background:var(--panel)}
.tape canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tape.disabled{cursor:default;opacity:.5}
.tape-range{
  position:absolute;top:0;bottom:0;background:var(--accent-soft);
  border-left:3px solid var(--accent);border-right:3px solid var(--accent);display:none;
}
.tape.wave .tape-range{background:rgba(245,184,61,.08)}
.tape-range.open-end{border-right-color:transparent}
.tape-range.open-start{border-left-color:transparent}
.tape-head{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--text);transform:translateX(-1px);display:none}
.tape-head::before{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top-color:var(--text)}
.tape-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}

/* ---------- editor ---------- */
.editor{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg)}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.editor-head h2{margin:0;font-size:16px;font-weight:700}
.editor-body{padding:16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.editor.collapsed .editor-body{display:none}
.editor[data-source="yt"] [data-only="audio"],
.editor[data-source="audio"] [data-only="yt"]{display:none}
.editor.locked [data-lock-hide]{display:none}
.locked-note{display:none;font-size:13.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.locked-note b{color:var(--accent)}
.editor.locked .locked-note{display:block}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .label{font-size:13px;font-weight:600;color:var(--muted)}
.input,.textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);outline:none;
}
.input:focus,.textarea:focus{border-color:var(--accent)}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input.bad{border-color:var(--danger)}
.textarea{resize:vertical;min-height:64px;line-height:1.5}
.url-row{display:flex;gap:8px}
.url-row .input{flex:1;min-width:0}
.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:18px 14px;
  border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--bg);cursor:pointer;text-align:center;
}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop.has-file{border-style:solid}
.drop svg{width:22px;height:22px;color:var(--accent);margin-bottom:2px}
.drop-main{font-weight:650;word-break:break-all}
.drop-sub{font-size:12.5px;color:var(--muted)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.time-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px}
.time-input{
  width:100%;border:0;background:transparent;outline:none;font-size:24px;font-weight:700;letter-spacing:-.01em;padding:2px 0;
}
.time-input::placeholder{color:var(--faint);font-weight:500}
.time-input.bad{color:var(--danger)}
.time-tools{display:grid;grid-template-columns:auto auto 1fr;gap:6px}
.nudge{
  min-width:44px;padding:7px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;font-weight:600;
}
.nudge:hover{border-color:#454b5c}
.mark{
  padding:7px 10px;border-radius:7px;border:1px solid rgba(245,184,61,.55);background:var(--accent-soft);color:var(--accent);
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;
}
.mark:hover{background:rgba(245,184,61,.26)}
.mark svg{width:14px;height:14px}
.form-msg{font-size:13.5px;color:var(--danger)}
.form-msg:empty{display:none}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-actions .spacer{flex:1}
.len-preview{font-size:13px;color:var(--muted)}
.len-preview b{color:var(--text)}

/* ---------- dialog / toast ---------- */
dialog{
  border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);color:var(--text);
  padding:22px;width:min(420px,calc(100vw - 32px));
}
dialog::backdrop{background:rgba(5,6,10,.65)}
dialog h3{margin:0 0 8px;font-size:17px}
dialog p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}
.dlg-actions{display:flex;flex-direction:column;gap:8px}
.dlg-actions .btn{justify-content:flex-start;padding:12px 14px;text-align:left;white-space:normal}
.dlg-actions .btn span{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.dlg-actions .btn-primary span{color:rgba(29,22,6,.75)}
.dlg-actions .btn > div{display:flex;flex-direction:column;gap:2px}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#f1efe9;color:#17181d;border-radius:10px;padding:10px 12px 10px 16px;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.18s ease;z-index:50;
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:#17181d;color:#f1efe9;border-radius:7px;padding:5px 10px;font-weight:700;font-size:13px;flex:none}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-areas:"main" "side";height:auto}
  .main{overflow:visible;padding:14px 14px 8px}
  .side{border-right:0;border-top:1px solid var(--line)}
  .list{overflow:visible;padding-bottom:90px}
  .side-head{position:sticky;top:0;z-index:5;background:var(--panel)}
  .times{grid-template-columns:1fr}
  .clip{grid-template-columns:18px 1fr auto}
  .play-hit{grid-column:2 / 3;grid-template-columns:104px 1fr}
  .thumb{width:104px}
  .clip-actions{opacity:1}
  .audio-box{grid-template-columns:auto 1fr;gap:16px;padding:18px}
  .audio-box #audDownload{grid-column:1 / -1}
  .big-play{width:60px;height:60px}
  .audio-title{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="저장한 구간">
    <div class="side-head">
      <div class="brand">
        <h1>
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="3" stroke="#a3a6b1" stroke-width="1.6"/>
            <path d="M8 5v14M16 5v14" stroke="#f5b83d" stroke-width="2.4"/>
          </svg>
          구간 보관함
        </h1>
        <div class="head-actions">
          <button class="icon-btn" id="exportBtn" title="백업 파일로 내보내기" aria-label="백업 파일로 내보내기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          </button>
          <button class="icon-btn" id="importBtn" title="백업 파일 불러오기" aria-label="백업 파일 불러오기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          </button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="q">구간 검색</label>
        <input id="q" type="search" placeholder="제목이나 메모로 찾기" autocomplete="off">
      </div>
      <div class="seg full" id="filterSeg" role="group" aria-label="종류별 보기">
        <button data-f="all" aria-pressed="true">전체</button>
        <button data-f="yt" aria-pressed="false">유튜브</button>
        <button data-f="audio" aria-pressed="false">음성</button>
      </div>
      <div class="count" id="count"></div>
    </div>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="notice" id="fileNotice" hidden></div>

      <div class="player-box" id="ytBox">
        <div id="player"></div>
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>
          <div>목록에서 구간을 누르면 여기서 재생돼요</div>
        </div>
        <div class="player-error" id="playerError" hidden></div>
      </div>

      <div class="audio-box" id="audioBox" hidden>
        <button class="big-play" id="audPlay" aria-label="재생">
          <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg>
        </button>
        <div class="audio-info">
          <div class="audio-kind" id="audKind">음성 파일</div>
          <div class="audio-title" id="audTitle"></div>
          <div class="audio-sub" id="audSub"></div>
        </div>
        <button class="btn" id="audDownload" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          구간 내려받기
        </button>
      </div>
      <audio id="aud" preload="auto" playsinline></audio>

      <div class="deck">
        <div class="now">
          <div class="now-title" id="nowTitle"></div>
          <div class="now-time" id="nowTime"></div>
        </div>
        <div class="tape disabled" id="tape" aria-label="재생 위치. 누르면 그 위치로 이동해요">
          <canvas id="wave"></canvas>
          <div class="tape-range" id="tapeRange"></div>
          <div class="tape-head" id="tapeHead"></div>
        </div>
        <div class="tape-labels"><span>0:00</span><span id="tapeEnd">–</span></div>
      </div>

      <section class="editor" id="editor" data-source="yt">
        <div class="editor-head">
          <h2 id="editorTitle">새 구간 만들기</h2>
          <button class="btn btn-sm" id="toggleEditor" aria-expanded="true">접기</button>
        </div>
        <div class="editor-body">
          <div class="seg" id="srcSeg" role="group" aria-label="구간 종류">
            <button data-src="yt" aria-pressed="true">유튜브 주소</button>
            <button data-src="audio" aria-pressed="false">음성 파일</button>
          </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const KEY = 'ytclips.v1';
  const ID_RE = /^[\w-]{11}$/;
  const AUDIO_EXT = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm)$/i;

  /* ================= storage: clip list ================= */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function isValidClip(c){
    if (!c || !Number.isFinite(+c.start) || !Number.isFinite(+c.end) || +c.end <= +c.start) return false;
    return c.type === 'audio' ? (typeof c.id === 'string' && c.id.length > 0) : ID_RE.test(c.videoId);
  }
  function normalize(c){
    const o = {
      id: typeof c.id === 'string' && c.id ? c.id : uid(),
      type: c.type === 'audio' ? 'audio' : 'yt',
      title: String(c.title || '제목 없는 구간').slice(0, 300),
      start: Math.max(0, Math.round(+c.start)),
      end: Math.round(+c.end),
      memo: String(c.memo || '').slice(0, 5000),
      createdAt: c.createdAt || Date.now()
    };
    if (o.type === 'yt') o.videoId = c.videoId;
    else {
      o.mime = String(c.mime || 'audio/mpeg');
      o.size = +c.size || 0;
      o.fileName = String(c.fileName || '').slice(0, 300);
      o.peaks = Array.isArray(c.peaks) ? c.peaks.slice(0, 400).map(v => Math.max(0, Math.min(1, +v || 0))) : [];
      o.length = +c.length > 0 ? +c.length : (o.end - o.start);
    }
    return o;
  }
  function load(){
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(isValidClip).map(normalize) : [];
    } catch (e) { return []; }
  }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(clips)); }
    catch (e) { toast('브라우저에 저장하지 못했어요. 백업 파일로 내보내 두세요.'); }
  }
  let clips = load();

  /* ================= storage: audio data (IndexedDB) ================= */
  const idb = (() => {
    let dbp = null;
    function open(){
      if (!dbp) dbp = new Promise((res, rej) => {
        const r = indexedDB.open('ytclips-audio', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('audio');
        r.onsuccess = () => res(r.result);
        r.onerror = () => { dbp = null; rej(r.error); };
      });
      return dbp;
    }
    async function run(mode, fn){
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('audio', mode);
        const req = fn(t.objectStore('audio'));
        t.oncomplete = () => res(req ? req.result : undefined);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error || new Error('abort'));
      });
    }
    return {
      get: k => run('readonly', s => s.get(k)),
      put: (k, v) => run('readwrite', s => s.put(v, k)),
      del: k => run('readwrite', s => s.delete(k))
    };
  })();
  let persistAsked = false;
  function requestPersist(){
    if (persistAsked) return; persistAsked = true;
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  }

  /* ================= helpers ================= */
  const pad = n => String(n).padStart(2, '0');
  function fmt(sec){
    sec = Math.max(0, Math.round(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
  function fmtSize(b){
    if (!b) return '0KB';
    if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + 'KB';
    return (b / 1024 / 1024).toFixed(1) + 'MB';
  }
  function parseTime(str){
    str = String(str || '').trim().replace(/：/g, ':');
    if (!str) return null;
    if (/^\d+$/.test(str)) return +str;
    const p = str.split(':');
    if (p.length < 2 || p.length > 3 || p.some(x => !/^\d+$/.test(x))) return NaN;
    const n = p.map(Number);
    if (p.length === 2){ if (n[1] > 59) return NaN; return n[0] * 60 + n[1]; }
    if (n[1] > 59 || n[2] > 59) return NaN;
    return n[0] * 3600 + n[1] * 60 + n[2];
  }
  function parseTParam(t){
    if (!t) return null;
    if (/^\d+s?$/.test(t)) return parseInt(t, 10);
    const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
    if (!m || !m[0]) return null;
    return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  }
  function parseYouTube(input){
    const s = String(input || '').trim();
    if (ID_RE.test(s)) return { id: s, t: null };
    let u;
    try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { return null; }
    const host = u.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (host === 'youtu.be') id = u.pathname.split('/')[1];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com'){
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else {
        const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);
        if (m) id = m[1];
      }
    }
    if (!id || !ID_RE.test(id)) return null;
    return { id, t: parseTParam(u.searchParams.get('t') || u.searchParams.get('start')) };
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  const baseName = n => String(n || '').replace(/\.[^.]+$/, '');
  const safeName = n => (String(n || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80)) || 'clip';
  function downloadBlob(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function abToB64(buf){
    const bytes = new Uint8Array(buf); let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function b64ToAb(b64){
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  const tick = () => new Promise(r => setTimeout(r, 0));

  /* ================= toast ================= */
  let toastTimer;
  function toast(msg, actLabel, act, sticky){
    const el = $('#toast'), btn = $('#toastAct');
    $('#toastMsg').textContent = msg;
    btn.hidden = !actLabel;
    if (actLabel){ btn.textContent = actLabel; btn.onclick = () => { el.classList.remove('show'); act(); }; }
    el.classList.add('show');
    clearTimeout(toastTimer);
    if (!sticky) toastTimer = setTimeout(() => el.classList.remove('show'), actLabel ? 6000 : 2800);
  }

  /* ================= file:// notice ================= */
  const isFile = location.protocol === 'file:';
  if (isFile){
    const n = $('#fileNotice');
    n.hidden = false;
    n.innerHTML = '<b>파일을 바로 열면 유튜브가 재생을 막을 수 있어요.</b> 재생이 안 되면 이 파일이 있는 폴더에서 터미널을 열고 <code>python3 -m http.server</code>를 실행한 뒤, 브라우저에서 <code>localhost:8000/youtube-clips.html</code>로 열어주세요. 음성 파일 구간은 이대로도 쓸 수 있어요.';
  }

  /* ================= audio processing ================= */
  let audioCtx = null;
  const getCtx = () => audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)());

  function computePeaks(buf, bins){
    const chs = []; for (let c = 0; c < Math.min(2, buf.numberOfChannels); c++) chs.push(buf.getChannelData(c));
    const len = buf.length, step = len / bins, out = [];
    for (let b = 0; b < bins; b++){
      const s = Math.floor(b * step), e = Math.max(s + 1, Math.floor((b + 1) * step));
      const stride = Math.max(1, Math.floor((e - s) / 600));
      let m = 0;
      for (const d of chs) for (let i = s; i < e && i < len; i += stride){ const v = d[i] < 0 ? -d[i] : d[i]; if (v > m) m = v; }
      out.push(m);
    }
    const max = Math.max(...out) || 1;
    return out.map(v => Math.round(v / max * 100) / 100);
  }

  async function cutBuffer(buf, s, e){
    const rate = 44100, ch = Math.min(2, buf.numberOfChannels), dur = e - s;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const off = new OAC(ch, Math.max(1, Math.ceil(dur * rate)), rate);
    const src = off.createBufferSource(); src.buffer = buf;
    const g = off.createGain();
    if (dur > 0.05){ // tiny fades so the cut doesn't click
      g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(1, 0.012);
      g.gain.setValueAtTime(1, dur - 0.012); g.gain.linearRampToValueAtTime(0, dur);
    }
    src.connect(g); g.connect(off.destination);
    src.start(0, s, dur);
    return await off.startRendering();
  }

  function loadScript(src){
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  let lameP = null;
  function loadLame(){
    if (window.lamejs) return Promise.resolve();
    if (!lameP){
      lameP = loadScript('https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js')
        .catch(() => loadScript('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js'))
        .then(() => { if (!window.lamejs) throw new Error('lame'); })
        .catch(e => { lameP = null; throw e; });
    }
    return lameP;
  }
  function toI16(f){
    const o = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++){ const s = f[i] < -1 ? -1 : f[i] > 1 ? 1 : f[i]; o[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
    return o;
  }
  async function encodeMp3(ab, onProgress){
    const ch = ab.numberOfChannels;
    const enc = new lamejs.Mp3Encoder(ch, ab.sampleRate, ch > 1 ? 160 : 96);
    const L = toI16(ab.getChannelData(0)), R = ch > 1 ? toI16(ab.getChannelData(1)) : null;
    const parts = [], block = 1152;
    for (let i = 0, n = 0; i < L.length; i += block, n++){
      const d = R ? enc.encodeBuffer(L.subarray(i, i + block), R.subarray(i, i + block)) : enc.encodeBuffer(L.subarray(i, i + block));
      if (d.length) parts.push(new Uint8Array(d));
      if (n % 150 === 0){ onProgress && onProgress(Math.round(i / L.length * 100)); await tick(); }
    }
    const e = enc.flush(); if (e.length) parts.push(new Uint8Array(e));
    return new Blob(parts, { type: 'audio/mpeg' });
  }
  function encodeWav(ab){
    const ch = ab.numberOfChannels, rate = ab.sampleRate, n = ab.length;
    const buf = new ArrayBuffer(44 + n * ch * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * ch * 2, true);
    const data = []; for (let c = 0; c < ch; c++) data.push(ab.getChannelData(c));
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++){
      const s = Math.max(-1, Math.min(1, data[c][i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
    }

  }
  async function encodeAudio(ab, onProgress){
    try { await loadLame(); return await encodeMp3(ab, onProgress); }
    catch (e) { console.warn('mp3 encoder unavailable, saving as wav', e); return encodeWav(ab); }
  }

  /* ================= players & view ================= */
  const aud = $('#aud');
  let view = 'none';            // 'none' | 'yt' | 'audio'
  let audLoaded = null;         // {kind:'source'} | {kind:'clip', id}
  let clipUrl = null;
  let mode = 'free';            // 'free' | 'clip' | 'preview'
  let activeId = null;
  let segEnd = null;

  // YouTube
  let player = null, ready = false, queued = [], loadedId = null, titleFillFor = null;

    const vars = { playsinline: 1, rel: 0, modestbranding: 1 };

    player = new YT.Player('player', {
      width: '100%', height: '100%', playerVars: vars,
      events: {
        onReady: () => { ready = true; queued.forEach(f => f()); queued = []; },

    });
  };
  const ytScript = document.createElement('script');
  ytScript.src = 'https://www.youtube.com/iframe_api';
  ytScript.onerror = () => showYtError('유튜브 플레이어를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  document.head.appendChild(ytScript);

  function showYtError(msg){ const e = $('#playerError'); e.textContent = msg; e.hidden = !msg; }
  function onYtError(ev){
    const map = {
      2: '영상 주소가 올바르지 않아요.',
      5: '이 브라우저에서 영상을 재생할 수 없어요.',
      100: '영상을 찾을 수 없어요. 삭제됐거나 비공개일 수 있어요.',
      101: '영상 주인이 다른 사이트에서의 재생을 막아둔 영상이에요.',
      150: '영상 주인이 다른 사이트에서의 재생을 막아둔 영상이에요.',
      153: isFile ? '파일을 바로 열어서 유튜브가 재생을 막았어요. 위 안내대로 localhost 주소로 열어주세요.' : '유튜브가 이 페이지에서의 재생을 막았어요.'
    };

  }
  function onYtState(ev){
    if (ev.data === YT.PlayerState.PLAYING) aud.pause();

      if (titleFillFor && titleFillFor === loadedId){
        const t = player.getVideoData && player.getVideoData().title;
        if (t){
          if (!$('#titleIn').value.trim() && draft.source === 'yt') $('#titleIn').value = t;

  }
  const ytTime = () => (ready && loadedId && player.getCurrentTime) ? player.getCurrentTime() || 0 : 0;
  const ytDur = () => (ready && loadedId && player.getDuration) ? player.getDuration() || 0 : 0;
  const ytPlaying = () => ready && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;

  function loadVideo(id, start, autoplay){
    setView('yt');

      showYtError('');

      }
    });
  }

  function setView(v){

  }

  // one interface over both players
  const M = {

  $('#audioFile').addEventListener('change', e => { pickFile(e.target.files[0]); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
  drop.addEventListener('drop', e => { e.preventDefault(); pickFile(e.dataTransfer.files[0]); });

  /* --- marking & nudging --- */
  $$('[data-mark]').forEach(b => b.addEventListener('click', () => {
    if (!draftOnScreen()){
      if (bringDraftOnScreen() === false && (draft.videoId || src))
        setMsg(draft.source === 'yt' ? '영상을 재생하면서 원하는 지점에서 다시 눌러주세요.' : '음성을 재생하면서 원하는 지점에서 다시 눌러주세요.');
      return;
    }
    draft[b.dataset.mark] = Math.round(M.time());
    mode = 'free';
    setMsg(''); syncTimes();
  }));

  $$('[data-nudge]').forEach(b => b.addEventListener('click', () => {
    const which = b.dataset.nudge, d = +b.dataset.d;
    const on = draftOnScreen();
    let base = draft[which];
    if (base == null) base = on ? Math.round(M.time()) : 0;
    let v = Math.max(0, base + d);
    const dur = on ? M.dur() : 0;
    if (dur) v = Math.min(Math.floor(dur), v);
    draft[which] = v;
    syncTimes(); setMsg('');
    if (on){ mode = 'free'; M.seek(v); }
  }));

  ['start', 'end'].forEach(which => {
    const el = $('#' + which + 'In');
    el.addEventListener('change', () => {
      const v = parseTime(el.value);
      if (v === null){ draft[which] = null; el.classList.remove('bad'); updateLen(); return; }
      if (Number.isNaN(v)){ el.classList.add('bad'); setMsg('시간은 1:23 또는 1:02:30처럼 분:초로 적어주세요.'); return; }
      draft[which] = v; el.classList.remove('bad'); setMsg('');
      el.value = fmt(v); updateLen();
      if (draftOnScreen()){ mode = 'free'; M.seek(v); }
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
  });
  $('#titleIn').addEventListener('input', updateNow);

  /* --- validation --- */
  function validateDraft(){
    if (draft.source === 'yt'){
      const v = parseYouTube($('#url').value);
      if (!v) return '유튜브 영상 주소를 확인해주세요.';
      if (v.id !== draft.videoId) draft.videoId = v.id;
    } else if (!src) return '먼저 음성 파일을 골라주세요.';
    const sIn = parseTime($('#startIn').value), eIn = parseTime($('#endIn').value);
    if (Number.isNaN(sIn) || Number.isNaN(eIn)) return '시간은 1:23 또는 1:02:30처럼 분:초로 적어주세요.';
    draft.start = sIn; draft.end = eIn;
    if (draft.start == null) return '시작 시간을 정해주세요.';
    if (draft.end == null) return '끝 시간을 정해주세요.';
    if (draft.end <= draft.start) return '끝 시간은 시작 시간보다 뒤여야 해요.';
    let dur = draftOnScreen() ? M.dur() : 0;
    if (draft.source === 'audio' && src.buffer) dur = src.buffer.duration;
    const what = draft.source === 'yt' ? '영상' : '파일';
    if (dur && draft.start >= Math.ceil(dur)) return `시작 시간이 ${what} 길이(${fmt(dur)})를 넘어요.`;
    if (dur && draft.end > Math.ceil(dur)) draft.end = Math.ceil(dur);
    return '';
  }

  $('#previewBtn').addEventListener('click', () => {
    const err = validateDraft();
    if (err){ setMsg(err); return; }
    setMsg(''); syncTimes();
    mode = 'preview'; segEnd = draft.end; activeId = null; renderList();
    if (draft.source === 'yt') loadVideo(draft.videoId, draft.start, true);
    else {
      showSourceAudio();
      whenAudMeta(() => { aud.currentTime = draft.start; aud.play().catch(() => {}); });
    }
  });

  /* --- saving --- */
  let saving = false;
  $('#saveBtn').addEventListener('click', async () => {
    if (saving) return;
    if (draft.locked){ // editing a saved audio clip: title & memo only
      const c = clips.find(x => x.id === draft.id);
      if (c){
        c.title = $('#titleIn').value.trim() || c.title;
        c.memo = $('#memoIn').value.trim();
        persist(); renderList(); updateAudioBox(); updateNow();
        toast('변경 사항을 저장했어요');
      }
      resetForm(false);
      return;
    }
    const err = validateDraft();
    if (err){ setMsg(err); return; }
    setMsg('');
    if (draft.source === 'yt') saveYt();
    else await saveAudio();
  });

  function saveYt(){
    const data = normalize({
      id: draft.id || uid(), type: 'yt', videoId: draft.videoId,
      title: $('#titleIn').value.trim() || '제목 없는 구간',
      start: draft.start, end: draft.end, memo: $('#memoIn').value.trim()
    });
    if (draft.id){
      const i = clips.findIndex(c => c.id === draft.id);
      if (i >= 0){ data.createdAt = clips[i].createdAt; clips[i] = data; } else clips.unshift(data);
      toast('변경 사항을 저장했어요');
      resetForm(false);
    } else {
      clips.unshift(data);
      toast('구간을 저장했어요');
      draft.start = null; draft.end = null; syncTimes();
      $('#titleIn').value = ''; $('#memoIn').value = '';
    }
    persist();
    $('#list').scrollTop = 0;
    renderList();
  }

  async function saveAudio(){
    const btn = $('#saveBtn'), label = btn.textContent;
    saving = true; btn.disabled = true;
    const from = src;
    try {
      btn.textContent = '파일 읽는 중…';
      let buf;
      try { buf = await from.decodeP; } catch (e) { throw new Error('decode'); }
      const s = draft.start, e = Math.min(draft.end, buf.duration);
      btn.textContent = '자르는 중…';
      await tick();
      const cut = await cutBuffer(buf, s, e);
      const peaks = computePeaks(cut, 160);
      const blob = await encodeAudio(cut, p => { btn.textContent = `저장 중… ${p}%`; });
      const id = uid();
      await idb.put(id, { buf: await blob.arrayBuffer(), mime: blob.type });
      requestPersist();
      const c = normalize({
        id, type: 'audio', title: $('#titleIn').value.trim() || baseName(from.name) || '제목 없는 구간',
        memo: $('#memoIn').value.trim(), start: s, end: e, mime: blob.type, size: blob.size,
        fileName: from.name, peaks, length: cut.duration
      });
      clips.unshift(c); persist();
      $('#list').scrollTop = 0;
      renderList();
      toast(`구간을 잘라서 저장했어요 · ${fmtSize(blob.size)}`);
      draft.start = null; draft.end = null; syncTimes();
      $('#titleIn').value = ''; $('#memoIn').value = '';
    } catch (err) {
      console.error(err);
      if (err && err.message === 'decode') setMsg('이 음성 파일을 읽지 못했어요. 이 브라우저가 지원하지 않는 형식이거나 파일이 너무 길 수 있어요. mp3나 m4a로 시도해주세요.');
      else if (err && err.name === 'QuotaExceededError') setMsg('브라우저 저장 공간이 부족해요. 필요 없는 음성 구간을 지우거나 백업한 뒤 정리해주세요.');
      else setMsg('음성을 잘라 저장하지 못했어요. 다시 시도하거나 다른 파일로 해보세요.');
    } finally {
      saving = false; btn.disabled = false; btn.textContent = label;
    }
  }

  /* --- edit / reset --- */
  function startEdit(c){
    draft = { id: c.id, source: c.type, videoId: c.type === 'yt' ? c.videoId : null, start: c.start, end: c.end, locked: c.type === 'audio' };
    $('#titleIn').value = c.title;
    $('#memoIn').value = c.memo;
    if (c.type === 'yt') $('#url').value = `https://youtu.be/${c.videoId}`;
    else $('#lockedRange').textContent = `${fmt(c.start)} – ${fmt(c.end)}`;
    syncTimes(); setMsg('');
    $('#editorTitle').textContent = '구간 수정';
    $('#saveBtn').textContent = '변경 저장';
    $('#cancelBtn').hidden = false;
    applySourceUi();
    setEditorOpen(true);
    activeId = c.id; mode = 'free'; renderList();
    if (c.type === 'yt') loadVideo(c.videoId, c.start, false);
    else playAudioClip(c, false);
    if (mqMobile.matches) $('#editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    else $('#titleIn').focus({ preventScroll: true });
  }

  function resetForm(clearSource){
    const source = draft.source;
    draft = newDraft(source);
    $('#url').value = ''; $('#titleIn').value = ''; $('#memoIn').value = '';
    $('#url').classList.remove('bad');
    if (clearSource && src){
      if (audLoaded && audLoaded.kind === 'source'){ aud.pause(); aud.removeAttribute('src'); aud.load(); audLoaded = null; setView(loadedId ? 'yt' : 'none'); }
      URL.revokeObjectURL(src.url); src = null;
      $('#drop').classList.remove('has-file');
      $('#fileName').textContent = '음성 파일 고르기';
      $('#fileMeta').textContent = 'mp3, m4a, wav 등 · 여기로 끌어다 놓아도 돼요';
    }
    syncTimes(); setMsg('');
    $('#editorTitle').textContent = '새 구간 만들기';
    $('#saveBtn').textContent = '구간 저장';
    $('#cancelBtn').hidden = true;
    applySourceUi();
    updateNow();
  }
  $('#cancelBtn').addEventListener('click', () => resetForm(false));
  $('#resetBtn').addEventListener('click', () => resetForm(true));

  /* ================= backup ================= */
  $('#exportBtn').addEventListener('click', async () => {
    if (!clips.length){ toast('내보낼 구간이 아직 없어요'); return; }
    const btn = $('#exportBtn'); btn.disabled = true;
    try {
      const audio = {}; let missing = 0;
      const audioClips = clips.filter(c => c.type === 'audio');
      if (audioClips.length) toast('백업 파일을 만드는 중…', null, null, true);
      for (const c of audioClips){
        let rec = null; try { rec = await idb.get(c.id); } catch (e) {}
        if (rec){ audio[c.id] = { mime: rec.mime, data: abToB64(rec.buf) }; await tick(); }
        else missing++;
      }
      const payload = { app: 'yt-clips', version: 2, exportedAt: new Date().toISOString(), clips, audio };
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      const d = new Date();
      downloadBlob(blob, `구간보관함-백업-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`);
      toast(`구간 ${clips.length}개를 백업 파일로 내보냈어요` + (audioClips.length ? ` · ${fmtSize(blob.size)}` : '') +
            (missing ? ` · 음성 데이터가 없는 ${missing}개는 정보만 담았어요` : ''));
    } catch (e) {
      console.error(e);
      toast('백업 파일을 만들지 못했어요. 음성 구간이 너무 많으면 일부를 지운 뒤 다시 시도해주세요.');
    } finally { btn.disabled = false; }
  });

  let incoming = [];
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const arr = Array.isArray(data) ? data : (data && Array.isArray(data.clips) ? data.clips : null);
      if (!arr) throw new Error('format');
      const audioMap = data && data.audio && typeof data.audio === 'object' ? data.audio : {};
      incoming = []; let bad = 0, noAudio = 0;
      for (const raw of arr){
        if (!isValidClip(raw)){ bad++; continue; }
        const c = normalize(raw);
        if (c.type === 'audio'){
          const a = audioMap[raw.id];
          if (!a || typeof a.data !== 'string'){ noAudio++; continue; }
          c._audio = a;
        }
        incoming.push(c);
      }
      if (!incoming.length){ toast('이 파일에는 불러올 구간이 없어요'); return; }
      const skipped = [];
      if (bad) skipped.push(`형식이 맞지 않는 ${bad}개`);
      if (noAudio) skipped.push(`음성 데이터가 없는 ${noAudio}개`);
      $('#importInfo').textContent = `백업 파일에서 구간 ${incoming.length}개를 찾았어요` +
        (skipped.length ? ` (${skipped.join(', ')}는 제외)` : '') +
        `. 지금 목록에는 ${clips.length}개가 있어요. 어떻게 불러올까요?`;
      $('#importDlg').showModal();
    } catch (err){
      toast('백업 파일을 읽지 못했어요. 이 앱에서 내보낸 .json 파일인지 확인해주세요.');
    }
  });
  async function storeIncomingAudio(list){
    for (const c of list){
      if (c._audio){ await idb.put(c.id, { buf: b64ToAb(c._audio.data), mime: String(c._audio.mime || 'audio/mpeg') }); await tick(); }
    }
  }
  const strip = c => { const o = Object.assign({}, c); delete o._audio; return o; };
  async function runImport(fn){
    $('#mergeBtn').disabled = $('#overwriteBtn').disabled = true;
    try { await fn(); requestPersist(); }
    catch (e){
      console.error(e);
      toast(e && e.name === 'QuotaExceededError' ? '브라우저 저장 공간이 부족해서 다 불러오지 못했어요.' : '불러오는 중에 문제가 생겼어요. 다시 시도해주세요.');
    } finally {
      $('#mergeBtn').disabled = $('#overwriteBtn').disabled = false;
      if ($('#importDlg').open) $('#importDlg').close();
      incoming = [];
    }
  }
  $('#mergeBtn').addEventListener('click', () => runImport(async () => {
    const have = new Set(clips.map(c => c.id));
    const add = incoming.filter(c => !have.has(c.id));
    await storeIncomingAudio(add);
    clips = clips.concat(add.map(strip));
    persist(); renderList();
    const dup = incoming.length - add.length;
    toast(`${add.length}개를 더했어요` + (dup ? ` · 이미 있던 ${dup}개는 건너뜀` : ''));
  }));
  $('#overwriteBtn').addEventListener('click', () => runImport(async () => {
    await storeIncomingAudio(incoming);
    const keep = new Set(incoming.map(c => c.id));
    for (const c of clips) if (c.type === 'audio' && !keep.has(c.id)){ try { await idb.del(c.id); } catch (e) {} }
    clips = incoming.map(strip);
    activeId = null;
    if (audLoaded && audLoaded.kind === 'clip'){ aud.pause(); aud.removeAttribute('src'); aud.load(); audLoaded = null; setView(loadedId ? 'yt' : 'none'); }
    persist(); renderList(); updateNow();
    toast(`목록을 백업 내용 ${clips.length}개로 바꿨어요`);
  }));
  $('#importCancel').addEventListener('click', () => $('#importDlg').close());

  applySourceUi();
  renderList();
  updateNow();
})();
</script>
</body>
</html>
